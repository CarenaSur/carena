<style>
:root{--cal:#F7F5F0;--piedra-cl:#E6E0D4;--piedra:#CFC6B6;--grafito:#2A2826;--albero:#8A6A33;--albero-cl:#CDA866;--sec:#6F675C;
--blanco:#fff;--ambar:#8a5a00;--ambar-bg:#fdf1d8;--rojo:#a4231c;--rojo-bg:#fbe4e1;--verde:#2f6b3a;--verde-bg:#e3f0e3;--sombra:0 1px 2px rgba(42,40,38,.08);
--b-cal:#B7791F;--b-pp:#2C7A7B;--b-vc:#3F7D4E;--azul:#2b5d8a;--azul-bg:#e4edf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cal);color:var(--grafito);font:15px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.ico.g{width:22px;height:22px}
.barra{position:sticky;top:0;z-index:20;background:var(--grafito);color:#F7F5F0;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.barra svg.logo{flex:none}
.barra .tit{font-weight:600;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .btn-b{background:rgba(247,245,240,.12);color:#F7F5F0;border-radius:10px;padding:8px 12px;font-weight:500}
.chip-red{display:flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;background:rgba(247,245,240,.12);color:#F7F5F0;white-space:nowrap}
.chip-red.sin{background:var(--ambar-bg);color:var(--ambar)}
.chip-red.err{background:var(--rojo-bg);color:var(--rojo)}
.punto{width:8px;height:8px;border-radius:50%;background:#7fbf8a}
.chip-red.sin .punto{background:var(--ambar)} .chip-red.err .punto{background:var(--rojo)} .chip-red.env .punto{background:var(--albero-cl)}
.tabs{display:flex;gap:4px;background:var(--grafito);padding:0 10px 8px}
.tab{flex:1;padding:9px 6px;border-radius:10px;color:#D8D1C4;font-weight:500;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{background:var(--cal);color:var(--grafito)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--albero-cl);color:var(--grafito);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.badge:empty{display:none}
main{padding:14px;max-width:1400px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
h2{font-size:15px;font-weight:600;margin:20px 2px 8px;color:var(--grafito);display:flex;align-items:center;gap:8px}
h2 .sub{font-weight:400}
h3.sec{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--sec);margin:22px 2px 8px}
.sub{color:var(--sec);font-size:13px}
.card{background:var(--blanco);border:1px solid var(--piedra);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sombra)}
.card.a{border-color:#e9cf96;background:#fffaf0}
.fila-dia{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.fila-dia .dia{flex:1;text-align:center;font-weight:600;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;background:var(--piedra-cl);font-weight:500;text-decoration:none;color:inherit}
.btn.pri{background:var(--grafito);color:#F7F5F0}
.btn.peligro{background:var(--rojo-bg);color:var(--rojo)}
.btn.ok{background:var(--verde-bg);color:var(--verde)}
.btn.aviso{background:var(--ambar-bg);color:var(--ambar)}
.btn.mini{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.visita{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:start}
@media(max-width:600px){.visita{grid-template-columns:56px 1fr}.visita>div:last-child{grid-column:1/-1}.visita>div:last-child .btn{width:100%}}
input[type=checkbox]{accent-color:var(--grafito)}
.hora{font-weight:600;font-size:17px}
.hora small{display:block;color:var(--sec);font-weight:400;font-size:12px}
.persona{padding:2px 0 8px}
.persona+.persona{border-top:1px solid var(--piedra-cl);padding-top:8px}
.nombre{font-weight:600;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:500;background:var(--piedra-cl);color:var(--grafito)}
.chip .ico{width:14px;height:14px;vertical-align:-2px}
.chip.a{background:var(--ambar-bg);color:var(--ambar)}
.chip.r{background:var(--rojo-bg);color:var(--rojo)}
.chip.v{background:var(--verde-bg);color:var(--verde)}
.chip.o{background:var(--grafito);color:#F7F5F0}
.chip.z{background:var(--azul-bg);color:var(--azul)}
.vacio{color:var(--sec);padding:30px 10px;text-align:center}
/* Sesión */
.reg-barra{position:sticky;top:calc(var(--alto-barra,58px));z-index:15;background:var(--cal);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--piedra)}
.reg-barra .esp{flex:1}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));margin-top:12px}
.col-cli{background:var(--blanco);border:1px solid var(--piedra);border-radius:14px;overflow:hidden}
.cab-cli{padding:12px 14px;background:var(--piedra-cl);border-bottom:1px solid var(--piedra)}
.cab-cli .nombre{display:flex;justify-content:space-between;gap:8px}
.prog{font-size:13px;color:var(--sec);font-weight:500}
.bloque{padding:7px 14px 5px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--sec);background:var(--cal);border-top:1px solid var(--piedra-cl);border-left:5px solid var(--piedra)}
.bloque.cal{border-left-color:var(--b-cal);color:#7a5214}.bloque.pp{border-left-color:var(--b-pp);color:#1f5a5b}.bloque.vc{border-left-color:var(--b-vc);color:#2d5c38}
.ej{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:10px 10px 10px 8px;border-top:1px solid var(--piedra-cl);min-height:64px}
.ej .marca{width:36px;height:36px;border-radius:10px;border:2px solid var(--piedra);display:flex;align-items:center;justify-content:center;color:transparent}
.ej.hecha .marca,.ej.cambiada .marca,.ej.anadida .marca{background:var(--grafito);border-color:var(--grafito);color:#F7F5F0}
.ej.quitada{opacity:.5}.ej.quitada .n{text-decoration:line-through}
.ej .n{font-weight:500}
.ej .d{font-size:13px;color:var(--sec);margin-top:2px}
.ej .d b{color:var(--grafito);font-weight:600}
.ej .acc{display:flex;gap:4px}
.icono{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--cal)}
.aviso-cab{margin-top:8px;font-size:13px}
.aviso-cab div{margin-top:3px}
/* Modal */
.velo,.velo-f{position:fixed;inset:0;background:rgba(42,40,38,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.velo,.velo-f{align-items:center}}
.modal,.modal-f{background:var(--cal);width:100%;max-width:660px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal,.modal-f{border-radius:18px}}
.modal h3,.modal-f h3{margin:2px 0 4px;font-size:18px}
.campo{margin-top:14px}
.campo>label,.etq{display:block;font-size:13px;font-weight:600;color:var(--sec);margin-bottom:6px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.opciones{display:flex;flex-wrap:wrap;gap:6px}
.op{min-width:44px;min-height:40px;padding:8px 11px;border-radius:10px;background:var(--blanco);border:1px solid var(--piedra);font-weight:500}
.op.on{background:var(--grafito);border-color:var(--grafito);color:#F7F5F0}
.op.a.on{background:var(--ambar);border-color:var(--ambar)}
.op.r.on{background:var(--rojo);border-color:var(--rojo)}
.op.v{border-color:#b6d3b8}.op.v.on{background:var(--verde);border-color:var(--verde)}
.escala .op.r{border-color:#e7c2bd}
.cab-bloque{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
details.mas>summary{padding:12px 0 2px;color:var(--albero);font-weight:600;font-size:14px}
.caja details.mas>summary{padding:12px 14px;border-top:1px solid var(--piedra-cl)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],input[type=email],textarea,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--piedra);background:var(--blanco);font-size:16px;min-height:44px}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#6F675C 50%),linear-gradient(135deg,#6F675C 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:70px;resize:vertical}
.casilla{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--blanco);border:1px solid var(--piedra)}
.casilla input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--grafito)}
.pie-modal{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.nota{font-size:13px;padding:8px 10px;border-radius:10px;margin-top:8px}
.nota.a{background:var(--ambar-bg);color:var(--ambar)} .nota.r{background:var(--rojo-bg);color:var(--rojo)} .nota.n{background:var(--piedra-cl)} .nota.v{background:var(--verde-bg);color:var(--verde)}
.lista-ej{max-height:46vh;overflow:auto;margin-top:8px;border:1px solid var(--piedra);border-radius:12px;background:var(--blanco)}
.lista-ej button{display:block;width:100%;text-align:left;padding:10px 12px;border-top:1px solid var(--piedra-cl)}
.lista-ej button:first-child{border-top:0}
.lista-ej button.on{background:var(--piedra-cl)}
.grupo-carga{margin-top:6px}
.grupo-carga span{display:block;font-size:12px;color:var(--sec);margin:6px 0 4px}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla td,.tabla th{padding:7px 4px;border-top:1px solid var(--piedra-cl);vertical-align:top;text-align:left}
.tabla th{font-size:12px;color:var(--sec);font-weight:600;border-top:0}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.buscar{display:flex;gap:8px;margin-bottom:10px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--piedra-cl);width:100%;text-align:left}
.item:first-child{border-top:0}
.item .der{display:flex;gap:6px;align-items:center;flex:none}
.caja{background:var(--blanco);border:1px solid var(--piedra);border-radius:14px;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--grafito);color:#F7F5F0;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}
.oculto{display:none!important}
.preg{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--piedra-cl)}
.preg:first-of-type{border-top:0}
.escala{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.escala .op{min-width:38px;min-height:38px;padding:6px 8px}
.escala .sep{width:8px}
.grafica{width:100%;height:auto;display:block}
.antes-despues{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-weight:600}
.antes-despues .flecha{color:var(--sec)}
.cab-cliente{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.kpi{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.kpi div{font-size:12px;color:var(--sec)}.kpi b{display:block;font-size:18px;color:var(--grafito)}
.subir{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.subir label.btn{position:relative;overflow:hidden}
.subir input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.ok-txt{color:var(--verde)} .mal-txt{color:var(--rojo)} .amb-txt{color:var(--ambar)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.res-val td:nth-child(n+2){white-space:nowrap}

/* ===== 0.4 · pulido y movimiento ===== */
:root{--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--e:cubic-bezier(.2,.8,.2,1);--muelle:cubic-bezier(.34,1.56,.64,1);--sombra-2:0 8px 26px -10px rgba(42,40,38,.28),0 1px 2px rgba(42,40,38,.08)}
.hora,.kpi b,.prog,.cr-num,.tabla td,.est,.dsem b,.anillo text{font-variant-numeric:tabular-nums}
button,.btn,.op,.item,.icono{transition:transform .16s var(--e),background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .22s ease,opacity .2s ease}
.btn:active,.op:active,.icono:active,.btn-b:active,.dsem:active,.cr-x:active{transform:scale(.95)}
.item:active{background:var(--cal)}
:focus-visible{outline:2px solid var(--albero-cl);outline-offset:2px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--albero);box-shadow:0 0 0 3px rgba(205,168,102,.28)}
input,textarea,select{transition:border-color .18s ease,box-shadow .18s ease}
.btn.pri{box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 3px 8px -3px rgba(42,40,38,.55)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Barra y pestañas */
.btn-b.ico-b{padding:0;width:40px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.btn-b.gira .ico{animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.chip-red .punto{transition:background-color .3s ease}
.chip-red.env .punto{animation:late 1s ease-in-out infinite}
@keyframes late{50%{transform:scale(1.8);opacity:.45}}
.badge.bote{animation:bote .55s var(--muelle)}
@keyframes bote{40%{transform:scale(1.4)}}
.tabs{position:relative}
.tab{position:relative;z-index:1}
.tab.on{background:transparent}
.tab .ico{width:17px;height:17px}
.tab-pill{position:absolute;left:0;top:0;width:0;border-radius:10px;background:var(--cal);pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tab-pill.listo{transition:transform .4s var(--e),width .4s var(--e)}
@media(max-width:600px){
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 rgba(0,0,0,.25),0 -10px 30px -12px rgba(0,0,0,.35)}
.tab{flex-direction:column;gap:2px;font-size:11.5px;padding:7px 2px 6px}
.tab .ico{width:20px;height:20px}
.tab .badge{position:absolute;top:3px;left:calc(50% + 7px);min-width:17px;height:17px;font-size:11px;padding:0 4px}
main{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.toast{bottom:calc(86px + env(safe-area-inset-bottom))}
}
/* Entradas de pantalla */
main{overflow-x:clip}
@supports not (overflow-x:clip){html{overflow-x:hidden}}
@keyframes sube{from{opacity:0;transform:translateY(14px)}}
@keyframes ade{from{opacity:0;transform:translateX(30px)}}
@keyframes atr{from{opacity:0;transform:translateX(-30px)}}
main.an-sube>*{animation:sube .46s var(--e) both}
main.an-ade>*{animation:ade .42s var(--e) both}
main.an-atr>*{animation:atr .42s var(--e) both}
main.an-dia-a>.visita,main.an-dia-a>.vacio{animation:ade .4s var(--e) both}
main.an-dia-b>.visita,main.an-dia-b>.vacio{animation:atr .4s var(--e) both}
main.an>*:nth-child(2){animation-delay:.04s}main.an>*:nth-child(3){animation-delay:.08s}main.an>*:nth-child(4){animation-delay:.12s}main.an>*:nth-child(5){animation-delay:.16s}
main.an>*:nth-child(6){animation-delay:.2s}main.an>*:nth-child(7){animation-delay:.24s}main.an>*:nth-child(8){animation-delay:.28s}main.an>*:nth-child(n+9){animation-delay:.32s}
main.an .cols>*{animation:sube .5s .1s var(--e) both}
main.an .cols>*:nth-child(2){animation-delay:.17s}
/* Hoy */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 2px 16px}
.hero h1{font:500 38px/1.02 var(--serif);margin:3px 0 7px;letter-spacing:-.005em}
.hero h1,.nombre.xl,.ava.g{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.hero-sub{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--albero)}
.hero-res{color:var(--sec);font-size:14px}
.enlace{color:var(--albero);font-weight:600;text-transform:none;letter-spacing:0;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.anillo{flex:none}
.anillo circle{fill:none;stroke:var(--piedra-cl);stroke-width:6}
.anillo circle.a{stroke:var(--b-vc);stroke-linecap:round;transform:rotate(-90deg);transform-origin:32px 32px;transition:stroke-dasharray .6s var(--e)}
main.an .anillo circle.a{animation:anillo 1s .15s var(--e) both}
@keyframes anillo{from{stroke-dasharray:0 100}}
.anillo text{font:600 15px Inter,sans-serif;fill:var(--grafito)}
.semana{gap:6px;margin:0 0 16px}
.semana .dias{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:0}
.dsem{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 7px;border-radius:14px;background:var(--blanco);border:1px solid var(--piedra-cl);min-height:64px;min-width:0}
.dsem small{font-size:11px;font-weight:600;color:var(--sec);letter-spacing:.05em}
.dsem b{font-size:17px;font-weight:600;line-height:1.2}
.dsem .pts{display:flex;gap:3px;height:7px;align-items:center}
.dsem .pts i{width:5px;height:5px;border-radius:50%;background:var(--piedra)}
.dsem .pts i.v{background:var(--b-vc)}
